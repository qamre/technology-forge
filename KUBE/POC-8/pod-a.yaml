apiVersion: v1
kind: Pod
metadata:
  name: pod-a
spec:
  containers:
    - name: toolbox
      image: qamre/toolbox:v1
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: shared-storage
          mountPath: /data
  volumes:
    - name: shared-storage
      persistentVolumeClaim:
        claimName: shared-pvc