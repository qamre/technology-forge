apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: app4
spec:
  selector:
    matchLabels:
      app: backend
  replicas: 1
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: qamre/postgress-db:backend-v1 
          ports:
            - containerPort: 8000
          env:
            - name: ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: app4-configmap
                  key: ADDRESS
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: app4-configmap
                  key: RUST_LOG
            - name: PG_DBNAME
              valueFrom:
                configMapKeyRef:
                  name: app4-configmap
                  key: PG_DBNAME
            - name: PG_HOST
              valueFrom: 
                configMapKeyRef:
                  name: app4-configmap
                  key: PG_HOST
            - name: PG_USER
              valueFrom:
                configMapKeyRef:
                  name: app4-configmap
                  key: PG_USER
            - name : PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app4-secret
                  key: PG_PASSWORD
