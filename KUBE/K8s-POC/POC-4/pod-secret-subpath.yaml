apiVersion: v1
kind: Pod
metadata:
  name: secret-inspector
spec:
  containers:
    - name: toolbox
      image: qamre/toolbox:v1
      env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_USERNAME
      volumeMounts:
        - name: db-secrets
          mountPath: /etc/app/secrets
  volumes:
    - name: db-secrets
      secret:
        secretName: db-credentials
