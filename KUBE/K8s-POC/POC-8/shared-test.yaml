apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shared-test
  template:
    metadata:
      labels:
        app: shared-test
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              POD=$(hostname)
              echo "$POD wrote this file at $(date)" >> /shared/data.txt
              echo "Contents:"
              cat /shared/data.txt
              sleep 3600
          volumeMounts:
            - name: shared-storage
              mountPath: /shared
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: shared-data

