apiVersion: v1
kind: PersistentVolume
metadata:
  name: poc7-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: poc7-local
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/data/poc7
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: poc7-local
  resources:
    requests:
      storage: 1Gi
  volumeName: poc7-pv

