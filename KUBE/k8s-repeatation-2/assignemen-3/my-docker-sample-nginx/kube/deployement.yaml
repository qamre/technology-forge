apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: frontend-webapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend-webapp
  template:
    metadata:
      labels:
        app: frontend-webapp
    spec:
      containers:
      - name: nginx
        image: qamre/cloudethix_configmap_alam:v3
        ports:
        - containerPort: 80
        volumeMounts:
            - name: configmap-volume
              mountPath: /usr/share/nginx/html/
      volumes:
        - name: configmap-volume
          configMap:
            name: frontend-webapp-configmap

