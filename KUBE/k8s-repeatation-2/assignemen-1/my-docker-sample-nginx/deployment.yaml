apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployments
spec:
  spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: qamre/cloudethix-nginix-qamre:v2