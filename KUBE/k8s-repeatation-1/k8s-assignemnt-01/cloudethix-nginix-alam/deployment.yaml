apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudethix-yourname-deployment
  namespace: cloudethix-alam
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudethix-yourname
  template:
    metadata:
      labels:
        app: cloudethix-yourname
    spec:
      containers:
        - name: cloudethix-yourname
          image: qamre/cloudethix-nginix-qamre:v1
          ports:
            - containerPort: 80
